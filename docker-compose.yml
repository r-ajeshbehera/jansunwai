# One command runs everything:  docker compose up --build   ->  http://localhost:3000
# Default AI provider is the offline mock (no keys, no cost). See docs/AI_DESIGN.md for Gemini / Ollama.
services:
  db:
    build: ./docker/postgres                  # PostgreSQL 16 + pgvector + PostGIS
    image: jansunwai-postgres:16
    environment:
      POSTGRES_DB: jansunwai
      POSTGRES_USER: jansunwai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-local-only}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jansunwai -d jansunwai"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"                 # local access only (psql, IDE); remove in production

  backend:
    build: ./backend
    image: jansunwai-backend:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}      # dev = with demo data; use prod for an empty system
      DB_URL: jdbc:postgresql://db:5432/jansunwai
      DB_USERNAME: jansunwai
      DB_PASSWORD: ${DB_PASSWORD:-change-me-local-only}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    env_file:                                  # optional: JWT_SECRET and AI settings (see .env.example)
      - path: .env
        required: false
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:8080:8080"                 # Swagger UI at http://localhost:8080/swagger-ui.html

  frontend:
    build: ./frontend
    image: jansunwai-frontend:latest
    depends_on:
      - backend
    ports:
      - "3000:80"

  # Optional free local AI:  docker compose --profile ollama up
  # and use the Ollama block in .env.example (AI_BASE_URL=http://ollama:11434 ...) - see docs/AI_DESIGN.md
  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  db-data:
  uploads:
  ollama:
