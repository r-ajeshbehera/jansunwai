spring:
  application:
    name: jansunwai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jansunwai}
    username: ${DB_USERNAME:jansunwai}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false            # no lazy loading while JSON is written
    hibernate:
      ddl-auto: none               # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # ---- Spring AI (only used when app.ai.provider=spring-ai) ---------------------------------
  # Default = Gemini through its OpenAI-compatible endpoint. For Ollama (free, local):
  #   AI_BASE_URL=http://localhost:11434  AI_CHAT_PATH=/v1/chat/completions  AI_EMBED_PATH=/v1/embeddings
  #   AI_CHAT_MODEL=llama3.1  AI_EMBED_MODEL=nomic-embed-text  AI_API_KEY=ollama
  ai:
    model:
      chat: ${SPRING_AI_CHAT:none}            # set to "openai" together with app.ai.provider=spring-ai
      embedding: ${SPRING_AI_EMBEDDING:none}
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    retry:
      max-attempts: 1                         # retries are handled by AiGateway (with our own limits)
    openai:
      api-key: ${AI_API_KEY:not-set}
      base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      chat:
        completions-path: ${AI_CHAT_PATH:/chat/completions}
        options:
          model: ${AI_CHAT_MODEL:gemini-flash-latest}
          temperature: 0.1
      embedding:
        embeddings-path: ${AI_EMBED_PATH:/embeddings}
        options:
          model: ${AI_EMBED_MODEL:gemini-embedding-001}
          dimensions: 768

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Base64 secret of at least 32 bytes. ALWAYS override with JWT_SECRET outside local development.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1kZXYtb25seS1zZWNyZXQtMTIzNDU2}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  rate-limit:
    auth-per-minute: ${AUTH_RATE_LIMIT:10}
    submit-per-minute: ${SUBMIT_RATE_LIMIT:5}
    public-per-minute: ${PUBLIC_RATE_LIMIT:30}
  uploads:
    directory: ${UPLOAD_DIR:./uploads}
    max-bytes: 5242880
    max-per-complaint: 5
  ai:
    provider: ${AI_PROVIDER:mock}             # mock | spring-ai
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
    max-attempts: 3
    min-confidence: 0.60                      # below this the AI suggestion is not used for routing
    embedding-dimensions: 768
    input-cost-per1k: ${AI_INPUT_COST_PER_1K:0}     # USD per 1,000 input tokens (0 for free tiers / Ollama)
    output-cost-per1k: ${AI_OUTPUT_COST_PER_1K:0}
  duplicates:
    min-semantic: ${DUP_MIN_SEMANTIC:0.40}    # tuned for the mock embedding; use about 0.75 for real embedding models
    min-total: 0.60
    radius-meters: 500
    window-days: 30
    max-candidates: 5
  sla:
    level2-after-hours: 24
    auto-close-days: 7
  jobs:
    enabled: ${JOBS_ENABLED:true}
